<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="bt">
  <title id="bt">CS AI4H Inaugural Symposium, October 12, Aggie Square</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022851"/>
      <stop offset="1" stop-color="#12406e"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbf00" stop-opacity="0"/>
      <stop offset=".25" stop-color="#ffbf00" stop-opacity="1"/>
      <stop offset=".8" stop-color="#ffbf00" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffbf00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- network of collaborators: edges then nodes -->
  <g stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5" fill="none">
    <path d="M90 118 L196 172 L142 268 L90 118 M196 172 L318 132 M318 132 L404 210 M142 268 L262 316 M262 316 L404 210 M404 210 L536 158 M536 158 L648 214 M262 316 L392 384 M392 384 L536 158 M648 214 L706 330 M392 384 L510 412 M510 412 L706 330"/>
  </g>
  <g fill="#ffffff">
    <circle cx="90" cy="118" r="6" fill-opacity=".55"/>
    <circle cx="196" cy="172" r="9" fill-opacity=".8"/>
    <circle cx="142" cy="268" r="5" fill-opacity=".45"/>
    <circle cx="318" cy="132" r="7" fill-opacity=".6"/>
    <circle cx="404" cy="210" r="12" fill="#ffbf00"/>
    <circle cx="262" cy="316" r="8" fill-opacity=".7"/>
    <circle cx="536" cy="158" r="10" fill="#ffbf00" fill-opacity=".85"/>
    <circle cx="648" cy="214" r="6" fill-opacity=".5"/>
    <circle cx="392" cy="384" r="9" fill-opacity=".75"/>
    <circle cx="510" cy="412" r="5" fill-opacity=".4"/>
    <circle cx="706" cy="330" r="7" fill-opacity=".55"/>
  </g>

  <!-- health signal running through the network -->
  <path d="M0 296 L150 296 L182 296 L206 240 L230 352 L256 268 L280 296 L470 296 L496 296 L520 214 L546 372 L572 296 L800 296"
        fill="none" stroke="url(#fade)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="60" y="440" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700"
        letter-spacing="3.5" fill="#ffbf00">OCTOBER 12  ·  1-6 PM  ·  AGGIE SQUARE</text>
  <text x="60" y="472" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13"
        letter-spacing="1.5" fill="#ffffff" fill-opacity=".7">UC Davis CS AI for Health Initiative</text>
</svg>
